<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glossar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>Glossar</h1>
      <p class="subtitle">Begriffe und Definitionen auf einen Blick</p>
    </div>
  </header>

  <main>
    <section class="controls">
      <div class="search-wrap">
        <input
          type="search"
          id="search"
          placeholder="Begriff suchen…"
          aria-label="Glossar durchsuchen"
          autocomplete="off"
        />
        <span class="search-icon" aria-hidden="true">🔍</span>
      </div>
      <button id="add-btn" class="btn-primary">+ Begriff hinzufügen</button>
    </section>

    <!-- Add / Edit form (hidden by default) -->
    <section id="form-section" class="form-section hidden" aria-live="polite">
      <h2 id="form-title">Neuen Begriff hinzufügen</h2>
      <form id="term-form" novalidate>
        <input type="hidden" id="edit-index" value="" />
        <div class="form-row">
          <label for="input-term">Begriff</label>
          <input type="text" id="input-term" required maxlength="100" />
        </div>
        <div class="form-row">
          <label for="input-def">Definition</label>
          <textarea id="input-def" required rows="4" maxlength="2000"></textarea>
        </div>
        <div class="form-row">
          <label for="input-category">Kategorie (optional)</label>
          <input type="text" id="input-category" maxlength="50" />
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary">Speichern</button>
          <button type="button" id="cancel-btn" class="btn-secondary">Abbrechen</button>
        </div>
      </form>
    </section>

    <!-- Alphabet quick-nav -->
    <nav id="alpha-nav" class="alpha-nav" aria-label="Alphabetische Navigation"></nav>

    <!-- Glossary list -->
    <section id="glossary" class="glossary" aria-live="polite"></section>

    <p id="no-results" class="no-results hidden">Kein Begriff gefunden.</p>
  </main>

  <footer>
    <p>Glossar &mdash; <span id="term-count">0</span> Einträge</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
